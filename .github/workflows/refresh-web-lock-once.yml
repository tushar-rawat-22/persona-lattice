name: Refresh web lock once

on:
  push:
    branches: ["v1-deployment-closure"]
    paths:
      - "apps/web/package.json"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1-deployment-closure
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Regenerate lockfile without lifecycle scripts
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify remediated production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "build: refresh web lockfile after security upgrade"
          git push origin HEAD:v1-deployment-closure
