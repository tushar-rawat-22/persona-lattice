name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e "./services/api[dev]"
      - run: ruff check services/api
      - name: Run API tests
        shell: bash
        run: |
          set +e
          output="$(pytest -q services/api/tests 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            diagnostic="$(printf '%s\n' "$output" | tail -n 70)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=API pytest failure::$diagnostic"
          fi
          exit "$status"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run build
