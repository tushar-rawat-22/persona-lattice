name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e "./services/api[dev]"
      - run: python -m pip check
      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --skip-editable
      - run: ruff check services/api
      - name: Run API tests
        shell: bash
        run: |
          set +e
          output="$(pytest -q services/api/tests 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            diagnostic="$(printf '%s\n' "$output" | tail -n 70)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=API pytest failure::$diagnostic"
          fi
          exit "$status"
      - name: Verify production launch preflight
        shell: bash
        run: |
          export PERSONALATTICE_ADMIN_USERNAME='ci-admin'
          export PERSONALATTICE_ADMIN_PASSWORD_HASH="$(python -c 'from app.admin_auth import hash_admin_password; print(hash_admin_password("ci-launch-password-123"))')"
          export PERSONALATTICE_COOKIE_SECURE='true'
          export PERSONALATTICE_DB_PATH="$RUNNER_TEMP/personalattice.db"
          export PERSONALATTICE_CASE_RETENTION_DAYS='30'
          export PERSONALATTICE_API_ORIGIN='http://127.0.0.1:8000'
          python -m app.launch_preflight

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Audit production web dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run typecheck
      - name: Verify operator workspace contract
        working-directory: apps/web
        run: npm run test:operator-workspace
      - working-directory: apps/web
        run: npm run build

  launch-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install launch smoke dependencies
        run: |
          python -m pip install -e "./services/api"
          npm ci --prefix apps/web --no-audit --no-fund
      - name: Verify LC1 acceptance shell syntax
        shell: bash
        run: |
          bash -n scripts/lc1_host_acceptance.sh
          bash -n scripts/lc1_browser_hold.sh
          bash -n scripts/lc1_acceptance_session.sh
          bash -n scripts/lc1_select_python.sh
          bash -n scripts/test_lc1_npm_worktree.sh
          bash -n scripts/test_lc1_python_selection.sh
          bash scripts/test_lc1_npm_worktree.sh
          bash scripts/test_lc1_python_selection.sh
      - name: Build and exercise production processes
        shell: bash
        run: |
          export PERSONALATTICE_ADMIN_USERNAME='ci-launch-admin'
          export PERSONALATTICE_LAUNCH_SMOKE_PASSWORD='ci-launch-process-password-123'
          export PERSONALATTICE_ADMIN_PASSWORD_HASH="$(python -c 'from app.admin_auth import hash_admin_password; print(hash_admin_password("ci-launch-process-password-123"))')"
          export PERSONALATTICE_COOKIE_SECURE='true'
          export PERSONALATTICE_DB_PATH="$RUNNER_TEMP/personalattice-launch.db"
          export PERSONALATTICE_CASE_RETENTION_DAYS='30'
          export PERSONALATTICE_API_ORIGIN='http://127.0.0.1:8000'
          python -m app.launch_preflight
          npm run --prefix apps/web build
          bash .github/scripts/launch_process_smoke.sh

  deployment-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build production API image
        run: docker build --file services/api/Dockerfile --tag personalattice-api:ci .
