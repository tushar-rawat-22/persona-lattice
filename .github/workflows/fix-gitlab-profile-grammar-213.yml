name: Fix GitLab profile grammar guard

on:
  push:
    branches:
      - source/gitlab-exact-profile-213

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source/gitlab-exact-profile-213
          fetch-depth: 0
      - name: Apply exact parser guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('services/api/app/providers/gitlab_public.py')
          text = path.read_text()
          old = '    if username.casefold() in _GITLAB_RESERVED_PROFILE_SEGMENTS:\n        return None\n    return username\n'
          new = '    if (\n        _GITLAB_USERNAME_SLUG.fullmatch(username) is None\n        or username.casefold() in _GITLAB_RESERVED_PROFILE_SEGMENTS\n    ):\n        return None\n    return username\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one parser guard, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm -- .github/workflows/fix-gitlab-profile-grammar-213.yml
          git diff --check
          git config user.name "PersonaLattice CI"
          git config user.email "actions@users.noreply.github.com"
          git add -- services/api/app/providers/gitlab_public.py
          git commit -m "Enforce canonical GitLab profile slug grammar"
          git push origin HEAD:source/gitlab-exact-profile-213
