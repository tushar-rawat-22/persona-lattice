name: Patch GitLab profile documentation

on:
  push:
    branches:
      - source/gitlab-exact-profile-213

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source/gitlab-exact-profile-213
          fetch-depth: 0
      - name: Apply exact documentation edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'THIRD_PARTY.md',
              '| GitLab REST API | GitLab Terms of Use / Acceptable Use Policy / API documentation | Active for exact public username and public-email profile matches plus exact canonical `gitlab.com/<namespace...>/<project>` public project URLs, including subgroup namespaces, through one shared unauthenticated provider budget. Person-oriented username/public-email list requests include GitLab\'s documented `humans=true` filter so bot and internal accounts cannot enter account-candidate evidence. Project lookup uses only `GET /api/v4/projects/{URL-encoded full path}`; local admission rejects `/-/` action routes, `/o/...` organization routes and other non-canonical URL forms, while returned project/namespace/canonical-URL metadata must match the supplied full path. The source retains bounded project/namespace state metadata, does not search projects/groups, enumerate owners or members, fetch repository content/contributors/commits/issues/MRs/releases/pipelines/packages, or emit project leads. No GitLab code or dataset is vendored. |',
              '| GitLab REST API | GitLab Terms of Use / Acceptable Use Policy / API documentation | Active for exact public username and public-email profile matches, exact canonical one-segment public profile URLs, and exact canonical `gitlab.com/<namespace...>/<project>` public project URLs including subgroup namespaces, through one shared unauthenticated provider budget. Person-oriented username/public-email/profile-URL requests reuse GitLab\'s documented `humans=true` filter so bot and internal accounts cannot enter account-candidate evidence; one-segment group namespaces resolve to a clean no-match rather than a person inference. Profile-URL admission rejects reserved top-level routes and other non-canonical forms. Project lookup uses only `GET /api/v4/projects/{URL-encoded full path}`; local admission rejects `/-/` action routes, `/o/...` organization routes and other non-canonical URL forms, while returned project/namespace/canonical-URL metadata must match the supplied full path. The source retains the existing reviewed profile fields and bounded project/namespace state metadata, does not search projects/groups, enumerate owners or members, fetch repository content/contributors/commits/issues/MRs/releases/pipelines/packages, or emit project leads. No GitLab code or dataset is vendored. |',
          )

          replace_once(
              'docs/ROADMAP.md',
              '- GitLab public profiles plus exact subgroup-aware public project metadata through one shared provider budget;',
              '- GitLab public profiles from exact username/public-email seeds or exact canonical public profile URLs plus exact subgroup-aware public project metadata through one shared provider budget;',
          )
          replace_once(
              'docs/ROADMAP.md',
              'GitLab username, exact public-email and exact public-project lookup share the same process-owned `gitlab_public_api` adapter and the same 20-request/minute local budget. Project applicability accepts exact canonical `https://gitlab.com/<namespace...>/<project>` paths with at least two non-empty segments. Local admission rejects credentials, custom ports, query/fragment, `.git`, empty or malformed `.`/`-` segments, organization-scoped `/o/...` routes and GitLab `/-/` action routes. The provider calls only official `GET /api/v4/projects/{URL-encoded full project path}` and requires `visibility=public`, exact full `path_with_namespace`, namespace `full_path` matching every namespace segment before the project name, and an exact canonical returned `web_url`. Retained project fields remain provider-specific display context and emit no leads. Username/public-email requests retain GitLab\'s documented `humans=true` filter.',
              'GitLab username, exact public-email, exact public-profile URL and exact public-project lookup share the same process-owned `gitlab_public_api` adapter and the same 20-request/minute local budget. Profile applicability accepts only canonical `https://gitlab.com/<username>` with one non-empty segment and rejects credentials, custom ports, query/fragment, percent-encoded paths, `/-/u/<id>` and documented reserved top-level routes. Profile URLs reuse the human-only username lookup; a one-segment group namespace therefore produces a clean no-match rather than a person inference. Returned profile username and canonical `web_url` must match the supplied username. Project applicability accepts exact canonical `https://gitlab.com/<namespace...>/<project>` paths with at least two non-empty segments. Local admission rejects credentials, custom ports, query/fragment, `.git`, empty or malformed `.`/`-` segments, organization-scoped `/o/...` routes and GitLab `/-/` action routes. The provider calls only official `GET /api/v4/projects/{URL-encoded full project path}` and requires `visibility=public`, exact full `path_with_namespace`, namespace `full_path` matching every namespace segment before the project name, and an exact canonical returned `web_url`. Retained project fields remain provider-specific display context and emit no leads. Username/public-email/profile-URL requests retain GitLab\'s documented `humans=true` filter.',
          )

          replace_once(
              'docs/CONTINUITY.md',
              '- GitLab public profile API plus exact subgroup-aware public project metadata through one shared provider budget;',
              '- GitLab public profile API from exact username/public-email seeds or exact canonical public profile URLs plus exact subgroup-aware public project metadata through one shared provider budget;',
          )
          replace_once(
              'docs/CONTINUITY.md',
              'GitLab username, exact-public-email and project lookups share one `gitlab_public_api` runtime owner and one 20-request/minute local budget. Exact project applicability accepts canonical `https://gitlab.com/<namespace...>/<project>` paths with at least two non-empty segments and no credentials, custom port, query, fragment, `.git`, malformed `.`/`-` segments, organization-scoped `/o/...` routes or GitLab `/-/` action routes. The project path calls only official `GET /api/v4/projects/{URL-encoded full project path}` and requires `visibility=public`, exact full `path_with_namespace`, namespace `full_path` equal to every namespace segment before the project name, and an exact canonical returned `web_url`. It retains only numeric project ID, exact path-with-namespace, public visibility, bounded namespace kind/full path, optional archived state, canonical provenance and `identity_claim=false`. Description/content, topics, popularity counters, owner/person metadata, members/contributors, commits, issues/MRs, releases, branches/tags, pipelines/jobs, packages and contact-like fields are excluded. Provider-specific project keys are absent from the generic lead extractor and regression coverage requires zero emitted leads. Username/public-email requests retain GitLab\'s provider-documented `humans=true` filter.',
              'GitLab username, exact-public-email, exact-profile-URL and project lookups share one `gitlab_public_api` runtime owner and one 20-request/minute local budget. Exact profile applicability accepts canonical `https://gitlab.com/<username>` with one non-empty segment and rejects credentials, custom ports, query/fragment, percent-encoded paths, `/-/u/<id>` and documented reserved top-level routes. Profile URLs reuse the provider-documented human-only username lookup, so bot/internal accounts are filtered and a one-segment group namespace produces a clean attempted no-match rather than a person inference. Returned profile username must match case-insensitively and its `web_url` must be canonical. Exact project applicability accepts canonical `https://gitlab.com/<namespace...>/<project>` paths with at least two non-empty segments and no credentials, custom port, query, fragment, `.git`, malformed `.`/`-` segments, organization-scoped `/o/...` routes or GitLab `/-/` action routes. The project path calls only official `GET /api/v4/projects/{URL-encoded full project path}` and requires `visibility=public`, exact full `path_with_namespace`, namespace `full_path` equal to every namespace segment before the project name, and an exact canonical returned `web_url`. It retains only numeric project ID, exact path-with-namespace, public visibility, bounded namespace kind/full path, optional archived state, canonical provenance and `identity_claim=false`. Description/content, topics, popularity counters, owner/person metadata, members/contributors, commits, issues/MRs, releases, branches/tags, pipelines/jobs, packages and contact-like fields are excluded. Provider-specific project keys are absent from the generic lead extractor and regression coverage requires zero emitted leads.',
          )

          queue = Path('docs/SOURCE_ADMISSION_QUEUE.md')
          text = queue.read_text()
          marker = '## Active after current code is merged\n\n'
          if text.count(marker) != 1:
              raise SystemExit('source admission active-section marker changed')
          section = '''### GitLab exact public profile URL\n\n**Decision:** admit only an exact canonical `https://gitlab.com/<username>` URL through the existing `gitlab_public_api` source.\n\nPrimary GitLab Users API, user-profile routing, reserved-name, API-terms and acceptable-use documentation were re-checked on 2026-08-21. Profile URL research reuses the existing `GET /users?username=<username>&humans=true` path, process-owned adapter and 20-request/minute local budget already shared by username, exact public-email and project research. No second provider, credential path or quota pool is created.\n\nApplicability requires one non-empty path segment, HTTPS, no credentials, custom port, query or fragment, no percent-encoded path, and no current documented reserved top-level route. `/-/u/<id>` is deliberately unsupported in this version. Because one-segment GitLab paths can also identify groups, PersonaLattice performs one human-only exact username lookup and treats no matching human as a completed no-match; it never infers a group as a person. Returned username and canonical `web_url` must match the supplied username. The reviewed public-profile field set is unchanged.\n\nSee `docs/source-admissions/GITLAB_EXACT_PROFILE_URL.md`.\n\n'''
          queue.write_text(text.replace(marker, marker + section, 1))
          PY

          git rm -- .github/workflows/patch-gitlab-profile-docs-213.yml
          git diff --check
          git diff --stat
          git config user.name "PersonaLattice CI"
          git config user.email "actions@users.noreply.github.com"
          git add -- THIRD_PARTY.md docs/ROADMAP.md docs/CONTINUITY.md docs/SOURCE_ADMISSION_QUEUE.md
          git commit -m "Document exact GitLab profile URL admission"
          git push origin HEAD:source/gitlab-exact-profile-213
