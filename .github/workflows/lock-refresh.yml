name: Temporary web lock refresh

on:
  push:
    branches:
      - fix/324-web-audit-next-sharp

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Regenerate web lockfile only
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "Regenerate patched web lockfile"
          git push
