[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personalattice-api"
version = "0.0.1"
description = "PersonaLattice API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "phonenumbers>=9,<10",
  "sqlalchemy==2.0.51",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.0",
  "pytest>=8.4,<9",
  "ruff==0.15.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the bootstrap lint contract explicit. Ruff 0.16 greatly expanded its
# default rule set; relying on moving defaults made the recovery nondeterministic.
select = ["E4", "E7", "E9", "F"]
