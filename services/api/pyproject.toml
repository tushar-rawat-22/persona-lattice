[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personalattice-api"
version = "0.0.1"
description = "PersonaLattice API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "pydantic==2.13.4",
  "phonenumbers==9.0.37",
  "sqlalchemy==2.0.51",
  "python-multipart==0.0.32",
  "pypdf==6.14.2",
  "sherlock-project==0.16.0",
  "argon2-cffi==25.1.0",
  "pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.0",
  "pip-audit==2.10.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
  "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the lint contract explicit. A prior moving Ruff default changed the
# repository contract without a deliberate review.
select = ["E4", "E7", "E9", "F"]
